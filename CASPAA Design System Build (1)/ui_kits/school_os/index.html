<!-- @dsCard group="School OS" viewport="1440x900" subtitle="Finance workspace — dashboard, invoices, payments, reconciliation" name="School OS (finance)" -->
<!-- @startingPoint section="School OS" subtitle="App shell with the finance role's views" viewport="1440x900" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a8491">
  <title>CASPAA — School Operating System</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/logo/caspaa-icon.svg">
  <link rel="stylesheet" href="../../styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../tw-config.js"></script>
  <style>
    body { margin: 0; font-family: 'Figtree', system-ui, sans-serif; background: #f8fafc; color: #1e293b; }
    a { color: inherit; text-decoration: none; cursor: pointer; }
    a:hover { color: inherit; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
  <script src="app-data.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="Shell.jsx"></script>
  <script type="text/babel" src="Views.jsx"></script>
  <script type="text/babel" data-presets="react">
    function RecordPaymentModal({ onClose, onSave }) {
      const [method, setMethod] = React.useState('transfer');
      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal-panel" role="dialog" aria-modal="true" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100">
              <h3 className="font-bold text-lg text-slate-900">Record Payment</h3>
              <button className="btn btn-ghost !p-1.5" aria-label="Close dialog" onClick={onClose}><OS.Icon name="x" className="w-5 h-5" /></button>
            </div>
            <div className="px-5 py-4 space-y-3">
              <div>
                <label className="input-label">Student</label>
                <select className="input" defaultValue="Adaeze Okoro">
                  {APPDATA.invoices.map(i => <option key={i.ref}>{i.student}</option>)}
                </select>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className="input-label">Amount Paid</label><input className="input" placeholder="48,000" /></div>
                <div><label className="input-label">Payment Date</label><input className="input" type="date" defaultValue="2026-07-28" /></div>
              </div>
              <div>
                <label className="input-label">Method</label>
                <div className="flex gap-2 flex-wrap">
                  {[['transfer', 'Bank transfer'], ['cash', 'Cash'], ['card', 'Card'], ['pos', 'POS']].map(m => (
                    <button key={m[0]} className={'chip ' + (method === m[0] ? 'active' : '')} onClick={() => setMethod(m[0])}>{m[1]}</button>
                  ))}
                </div>
              </div>
              <div><label className="input-label">Teller / reference</label><input className="input" placeholder="TRF-88213" /></div>
            </div>
            <div className="px-5 py-3 border-t border-slate-100 bg-slate-50 flex justify-end gap-2">
              <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
              <button className="btn btn-primary" onClick={onSave}>Save Payment</button>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [view, setView] = React.useState('fin_dashboard');
      const [modal, setModal] = React.useState(false);
      const [offline, setOffline] = React.useState(false);
      const [toasts, setToasts] = React.useState([]);

      const toast = (msg, type) => {
        const id = Date.now() + Math.random();
        setToasts(t => t.concat([{ id: id, msg: msg, type: type || 'success' }]));
        setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
      };

      const Screen = VIEWS[view] || VIEWS.__fallback(view);
      const title = (APPDATA.nav.find(n => n.key === view) || {}).label || 'CASPAA';

      return (
        <div className="min-h-screen flex bg-slate-50">
          <OS.Sidebar active={view} onSelect={setView} />
          <div className="flex-1 min-w-0 lg:ml-64 flex flex-col min-h-screen">
            <OS.TopBar title={title} offline={offline}
              onToggleOffline={() => { const next = !offline; setOffline(next); toast(next ? 'Offline mode ON — changes will sync when you come back online' : 'Back online', next ? 'warn' : 'success'); }}
              onSearch={() => toast('Global search opens with the / key', 'info')}
              onNotify={() => toast('3 unread notifications', 'info')} />
            <OS.ConnStatus offline={offline} />
            <main id="mainArea" className="flex-1 overflow-y-auto p-4 lg:p-6 pb-24 lg:pb-6">
              <div className="fade-in"><Screen onRecord={() => setModal(true)} /></div>
            </main>
            <OS.BottomNav active={view} onSelect={setView} />
          </div>
          {modal && <RecordPaymentModal onClose={() => setModal(false)} onSave={() => { setModal(false); toast('Payment recorded'); }} />}
          <div id="toasts" className="fixed bottom-4 right-4 z-50 space-y-2">
            {toasts.map(t => (
              <div key={t.id} className={'toast ' + t.type}>
                <div className={t.type === 'warn' ? 'text-amber-600' : t.type === 'info' ? 'text-brand-600' : 'text-emerald-600'}>
                  <OS.Icon name={t.type === 'success' ? 'check' : 'bell'} className="w-5 h-5" />
                </div>
                <div className="flex-1 text-sm font-medium text-slate-800">{t.msg}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
