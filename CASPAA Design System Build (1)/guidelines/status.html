<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../ui_kits/tw-config.js"></script>
<style>body{margin:0;padding:20px;background:#fff;color:#1e293b;font-family:'Figtree',system-ui,sans-serif}.lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#808d9b;margin-bottom:8px}.hex{font-size:11px;color:#9aa5b1;font-variant-numeric:tabular-nums}</style>
</head><body>
<div style="display:flex;gap:12px"><div><div style="width:120px;height:70px;background:#dcfce7;border-radius:7px;display:flex;align-items:center;justify-content:center"><span style="background:#dcfce7;color:#166534;font-size:11.2px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid rgba(0,0,0,.05)">Paid</span></div><div class="lbl" style="margin:6px 0 0">Success</div><div class="hex">#dcfce7 / #166534</div></div><div><div style="width:120px;height:70px;background:#fef3c7;border-radius:7px;display:flex;align-items:center;justify-content:center"><span style="background:#fef3c7;color:#92400e;font-size:11.2px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid rgba(0,0,0,.05)">Partial</span></div><div class="lbl" style="margin:6px 0 0">Warn</div><div class="hex">#fef3c7 / #92400e</div></div><div><div style="width:120px;height:70px;background:#fee2e2;border-radius:7px;display:flex;align-items:center;justify-content:center"><span style="background:#fee2e2;color:#991b1b;font-size:11.2px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid rgba(0,0,0,.05)">Outstanding</span></div><div class="lbl" style="margin:6px 0 0">Danger</div><div class="hex">#fee2e2 / #991b1b</div></div><div><div style="width:120px;height:70px;background:#d3ebed;border-radius:7px;display:flex;align-items:center;justify-content:center"><span style="background:#d3ebed;color:#086c77;font-size:11.2px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid rgba(0,0,0,.05)">Trial</span></div><div class="lbl" style="margin:6px 0 0">Info</div><div class="hex">#d3ebed / #086c77</div></div><div><div style="width:120px;height:70px;background:#f1f5f9;border-radius:7px;display:flex;align-items:center;justify-content:center"><span style="background:#f1f5f9;color:#475569;font-size:11.2px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid rgba(0,0,0,.05)">Withdrawn</span></div><div class="lbl" style="margin:6px 0 0">Neutral</div><div class="hex">#f1f5f9 / #475569</div></div></div>
</body></html>
