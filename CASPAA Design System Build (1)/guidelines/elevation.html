<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Two-layer card shadow · 8/24 hover · toast and modal pops" name="Elevation" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../ui_kits/tw-config.js"></script>
<style>body{margin:0;padding:20px;background:#fff;color:#1e293b;font-family:'Figtree',system-ui,sans-serif}.lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#808d9b;margin-bottom:8px}.hex{font-size:11px;color:#9aa5b1;font-variant-numeric:tabular-nums}</style>
</head><body>
<div style="display:flex;gap:16px;background:#f8fafc;padding:18px;border-radius:7px">
    <div><div style="width:150px;height:70px;background:#fff;border:1px solid #f1f5f9;border-radius:7px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.05)"></div><div class="lbl" style="margin:6px 0 0">--shadow-card</div></div>
    <div><div style="width:150px;height:70px;background:#fff;border:1px solid #b6dade;border-radius:7px;box-shadow:0 8px 24px rgba(15,23,42,.08);transform:translateY(-2px)"></div><div class="lbl" style="margin:6px 0 0">--shadow-card-hover</div></div>
    <div><div style="width:150px;height:70px;background:#fff;border-radius:7px;box-shadow:0 8px 24px rgba(15,23,42,.15);border-left:4px solid #16a34a"></div><div class="lbl" style="margin:6px 0 0">--shadow-toast</div></div>
  </div>
</body></html>
