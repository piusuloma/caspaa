<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a2540" />
  <title>CASPAA — School Operating System</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a2540'/%3E%3Ctext x='50' y='68' font-size='56' font-weight='700' text-anchor='middle' fill='white' font-family='system-ui'%3EC%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.49.1/dist/apexcharts.min.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            /* CASPAA Blue — primary: actions, CTAs, active states */
            brand: {
              50: '#e8ecf1', 100: '#c5d0dd', 200: '#94a7bf',
              300: '#5d7a9c', 400: '#315479', 500: '#143a5c',
              600: '#0a2540', 700: '#081d33', 800: '#061627', 900: '#04101c'
            },
            /* CASPAA Blue tints — dark surfaces alias the brand now */
            navy: {
              50: '#e8ecf1', 100: '#c5d0dd', 200: '#94a7bf',
              300: '#5d7a9c', 400: '#315479', 500: '#143a5c',
              600: '#0a2540', 700: '#081d33', 800: '#0a2540', 900: '#04101c'
            },
            /* Accent — CASPAA Green: highlights, active tabs, chart pops */
            accent: {
              50: '#e6f8f3', 100: '#c3f0e2', 200: '#8ae4c9',
              300: '#4fd6ae', 400: '#1ec79a', 500: '#00c08f',
              600: '#00b386', 700: '#00966f', 800: '#007a5b', 900: '#005e46'
            },
            /* Accent Gold */
            gold: {
              50: '#fef8e7', 100: '#fdecb8', 200: '#fbdd85', 300: '#f9cd52',
              400: '#f7c02c', 500: '#f4b400', 600: '#d69e00', 700: '#ab7f00'
            },
            /* Scholar Gray */
            scholar: { 400: '#9aa5b1', 500: '#808d9b', 600: '#6b7784' },
            /* Success semantics: emerald-* is used 574x for success states, so it
               resolves to CASPAA Green — not onto the navy primary, which made a
               passing grade and a primary button the same colour. */
            emerald: {
              50: '#e6f8f3', 100: '#c3f0e2', 200: '#8ae4c9',
              300: '#4fd6ae', 400: '#1ec79a', 500: '#00c08f',
              600: '#00b386', 700: '#00966f', 800: '#007a5b', 900: '#005e46'
            },
            /* Green aliases — kept so accent-green utilities keep resolving */
            coral: { 50: '#e6f8f3', 100: '#c3f0e2', 200: '#8ae4c9', 300: '#4fd6ae', 400: '#1ec79a', 500: '#00b386', 600: '#00966f', 700: '#007a5b' },
            apricot: { 50: '#fef8e7', 100: '#fdecb8', 200: '#fbdd85', 300: '#f9cd52', 400: '#f7c02c', 500: '#f4b400', 600: '#d69e00', 700: '#ab7f00' },
            mint: { 100: '#e6f8f3', 200: '#c3f0e2', 300: '#8ae4c9', 400: '#4fd6ae' },
            sand: { 100: '#f8fafc', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#808d9b' },
            cream: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0' }
          },
          borderRadius: { sm: '7px', DEFAULT: '7px', md: '7px', lg: '7px', xl: '7px', '2xl': '7px', '3xl': '7px', full: '9999px' },
          fontFamily: { sans: ['Figtree', 'system-ui', 'sans-serif'], mono: ['Figtree', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

  <!-- Connection status pill -->
  <div id="connStatus" class="fixed top-3 left-1/2 -translate-x-1/2 z-50 hidden">
    <div class="px-3 py-1.5 rounded-full text-xs font-medium shadow-lg flex items-center gap-2">
      <span class="w-2 h-2 rounded-full"></span>
      <span class="text-label"></span>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toasts" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm"></div>

  <!-- Modal root -->
  <div id="modalRoot"></div>

  <!-- Main app root -->
  <div id="app"></div>

  <!-- App scripts -->
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/modules/admin.js"></script>
  <script src="js/modules/frontdesk.js"></script>
  <script src="js/modules/teacher.js"></script>
  <script src="js/modules/parent.js"></script>
  <script src="js/modules/finance.js"></script>
  <script src="js/modules/superadmin.js"></script>
  <script src="js/modules/student.js"></script>
  <script src="js/modules/shared.js"></script>
  <script src="js/modules/calendar.js"></script>
  <script src="js/modules/diary.js"></script>
  <script src="js/modules/houses.js"></script>
  <script src="js/modules/payslip.js"></script>
  <script src="js/modules/feedback.js"></script>
  <script src="js/modules/formative.js"></script>
  <script src="js/modules/transport.js"></script>
  <script src="js/modules/health.js"></script>
  <script src="js/modules/assessments.js"></script>
  <script src="js/modules/payment.js"></script>
  <script src="js/modules/notify.js"></script>
  <script src="js/modules/inventory.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
